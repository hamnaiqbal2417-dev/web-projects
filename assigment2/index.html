<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form aur Table</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 30px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 700px;
  }
  .form-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 25px;
  }
  .form-card h2 {
    margin-top: 0;
    font-size: 18px;
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #888;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .error-msg {
    color: #d33;
    font-size: 13px;
    margin: 0 0 10px;
    display: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px #ddd;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    font-size: 14px;
    border-bottom: 1px solid #eee;
  }
  th {
    background: #f0f1f3;
    color: #444;
    font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  .del-btn {
    background: #e74c3c;
    padding: 5px 12px;
    font-size: 13px;
  }
  .del-btn:hover { background: #c0392b; }
  #empty-msg {
    text-align: center;
    padding: 15px;
    color: #999;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="container">

  <div class="form-card">
    <h2>Naya record add karein</h2>
    <div class="form-row">
      <div>
        <label for="f-name">Name</label>
        <input type="text" id="f-name" placeholder="Ali Khan">
      </div>
      <div>
        <label for="f-email">Email</label>
        <input type="text" id="f-email" placeholder="ali@example.com">
      </div>
      <div>
        <label for="f-role">Role</label>
        <input type="text" id="f-role" placeholder="Developer">
      </div>
    </div>
    <p id="form-error" class="error-msg"></p>
    <button id="add-btn">+ Add Row</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th style="text-align:right;">Action</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <p id="empty-msg">Abhi koi record nahi hai.</p>

</div>

<script>
  let rows = [
    { name: "Sara Ahmed", email: "sara@example.com", role: "Designer" },
    { name: "Bilal Raza", email: "bilal@example.com", role: "Manager" }
  ];

  const tbody = document.getElementById('table-body');
  const emptyMsg = document.getElementById('empty-msg');
  const errEl = document.getElementById('form-error');

  function render() {
    tbody.innerHTML = '';

    if (rows.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      rows.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.name}</td>
          <td>${r.email}</td>
          <td>${r.role}</td>
          <td style="text-align:right;">
            <button class="del-btn" data-idx="${i}">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-idx'));
          rows.splice(idx, 1);
          render();
        });
      });
    }
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    const nameEl = document.getElementById('f-name');
    const emailEl = document.getElementById('f-email');
    const roleEl = document.getElementById('f-role');

    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const role = roleEl.value.trim();

    if (!name || !email || !role) {
      errEl.textContent = 'Tamam fields bharna zaroori hai.';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    rows.push({ name, email, role });
    nameEl.value = '';
    emailEl.value = '';
    roleEl.value = '';
    render();
  });

  ['f-name', 'f-email', 'f-role'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      errEl.style.display = 'none';
    });
  });

  render();
</script>

</body>
</html>
